<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Email Cleaner App</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
}

.app-card {
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,.25);
}

textarea {
    min-height: 110px;
    border-radius: 10px;
}

.table-wrap {
    max-height: 420px;
    overflow: auto;
}

thead th {
    position: sticky;
    top: 0;
    background: #f8f9fa;
}

.source-box {
    position: relative;
}

.remove-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    border-radius: 50%;
}
</style>
</head>

<body class="p-4">

<div class="container-fluid">
    <h2 class="text-center text-white fw-bold mb-4">
        📧 Email Cleaner App
    </h2>

    <div class="row g-4">

        <!-- INPUT -->
        <div class="col-lg-6">
            <div class="card app-card p-3">
                <h5 class="fw-bold mb-3">Nguồn dữ liệu</h5>

                <div id="inputContainer" class="d-grid gap-3"></div>

                <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary" onclick="addSource()">➕ Thêm nguồn</button>
                        <button class="btn btn-outline-danger" onclick="clearAllSources()">🧹 Clean ALL</button>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="uniqueToggle">
                        <label class="form-check-label fw-bold">Unique + Count</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- OUTPUT -->
        <div class="col-lg-6">
            <div class="card app-card p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="fw-bold mb-0">Kết quả</h5>
                    <button class="btn btn-primary" onclick="copyTable()">📋 Copy</button>
                </div>

                <div class="table-wrap">
                    <table class="table table-bordered table-hover table-sm" id="resultTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <span class="badge bg-success mt-2" id="stats">Email: 0</span>
            </div>
        </div>

    </div>
</div>

<script>
const inputContainer = document.getElementById("inputContainer");
const toggle = document.getElementById("uniqueToggle");
const stats = document.getElementById("stats");

// tạo nguồn ban đầu
addSource();

function addSource() {
    const wrapper = document.createElement("div");
    wrapper.className = "source-box";

    const ta = document.createElement("textarea");
    ta.className = "form-control input";
    ta.placeholder = "Dán dữ liệu email tại đây...";
    ta.addEventListener("input", render);

    const btn = document.createElement("button");
    btn.className = "btn btn-sm btn-danger remove-btn";
    btn.innerHTML = "✕";
    btn.onclick = () => {
        wrapper.remove();
        render();
    };

    wrapper.appendChild(ta);
    wrapper.appendChild(btn);
    inputContainer.appendChild(wrapper);
}

function clearAllSources() {
    inputContainer.innerHTML = "";
    render();
}

function getEmails() {
    let raw = "";
    document.querySelectorAll(".input").forEach(t => raw += " " + t.value);
    raw = raw.toLowerCase();
    return raw.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/g) || [];
}

function render() {
    const emails = getEmails();
    const unique = toggle.checked;
    const thead = document.querySelector("#resultTable thead");
    const tbody = document.querySelector("#resultTable tbody");

    thead.innerHTML = "";
    tbody.innerHTML = "";

    if (!unique) {
        thead.innerHTML = `<tr><th>Email</th></tr>`;
        emails.forEach(e =>
            tbody.insertAdjacentHTML("beforeend", `<tr><td>${e}</td></tr>`)
        );
        stats.innerText = "Email: " + emails.length;
    } else {
        const map = {};
        emails.forEach(e => map[e] = (map[e] || 0) + 1);

        thead.innerHTML = `<tr><th>Email</th><th>Số lượng</th></tr>`;
        Object.entries(map).forEach(([email, count]) =>
            tbody.insertAdjacentHTML(
                "beforeend",
                `<tr><td>${email}</td><td>${count}</td></tr>`
            )
        );
        stats.innerText = "Email: " + Object.keys(map).length;
    }
}

function copyTable() {
    let text = "";
    document.querySelectorAll("#resultTable tbody tr").forEach(row => {
        text += [...row.children].map(td => td.innerText).join("\t") + "\n";
    });
    navigator.clipboard.writeText(text);
    alert("Đã copy");
}

toggle.addEventListener("change", render);
</script>

</body>
</html>
