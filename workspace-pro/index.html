<!doctype html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Workspace Pro</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="./assets/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="appShell" class="min-vh-100">
    <header class="app-header sticky-top">
      <div class="container-fluid px-3 py-2 d-flex align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-2">
          <div class="brand-logo"><i class="bi bi-stars"></i></div>
          <div>
            <div class="fw-bold lh-1">Workspace Pro</div>
            <div class="small text-secondary mt-1">Local workspace · GitHub Pages</div>
          </div>
        </div>
        <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#settingsModal">
          <i class="bi bi-gear me-1"></i> Cài đặt
        </button>
      </div>

      <!-- Todo reminder is global and stays visible on every module -->
      <div id="globalReminderWrap" class="container-fluid px-3 d-none">
        <div id="globalReminder" class="alert alert-warning py-2 px-3 mb-2 d-flex align-items-center gap-2 shadow-sm">
          <i class="bi bi-alarm-fill fs-5"></i>
          <div class="flex-grow-1 min-w-0">
            <div id="globalReminderTitle" class="fw-semibold text-truncate"></div>
            <div id="globalReminderMeta" class="small opacity-75"></div>
          </div>
          <button id="globalReminderDone" class="btn btn-sm btn-success">
            <i class="bi bi-check2"></i> Xong
          </button>
          <button id="globalReminderOpen" class="btn btn-sm btn-outline-dark">
            Mở Todo
          </button>
        </div>
      </div>

      <div class="container-fluid px-3 pb-2">
        <ul class="nav nav-pills gap-1 flex-nowrap overflow-x-auto" id="mainNav">
          <li class="nav-item">
            <button class="nav-link active" data-module="bookmark"><i class="bi bi-bookmark-fill me-1"></i>Dấu trang</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-module="todo"><i class="bi bi-check2-square me-1"></i>Việc cần làm</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-module="powershell"><i class="bi bi-terminal-fill me-1"></i>PowerShell</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-module="twofa"><i class="bi bi-shield-lock-fill me-1"></i>2FA</button>
          </li>
        </ul>
      </div>
    </header>

    <main class="container-fluid p-3">
      <section class="module-view active" id="module-bookmark"></section>
      <section class="module-view" id="module-todo"></section>
      <section class="module-view" id="module-powershell"></section>
      <section class="module-view" id="module-twofa"></section>
    </main>
  </div>

  <!-- Shared confirm modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Xác nhận</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="confirmMessage"></div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-danger" id="confirmOk">Xóa</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings / backup -->
  <div class="modal fade" id="settingsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-gear me-2"></i>Cài đặt dữ liệu</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="small text-secondary">
            Bookmark, Todo và PowerShell được lưu trong <code>localStorage</code> của trình duyệt hiện tại.
            2FA không được lưu.
          </p>
          <div class="d-grid gap-2">
            <button class="btn btn-outline-primary" id="exportDataBtn">
              <i class="bi bi-download me-1"></i>Xuất backup JSON
            </button>
            <label class="btn btn-outline-primary mb-0">
              <i class="bi bi-upload me-1"></i>Nhập backup JSON
              <input id="importDataInput" type="file" accept=".json,application/json" hidden>
            </label>
            <button class="btn btn-outline-danger" id="clearAllDataBtn">
              <i class="bi bi-trash3 me-1"></i>Xóa toàn bộ dữ liệu local
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 2FA dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/otpauth@9.1.4/dist/otpauth.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
