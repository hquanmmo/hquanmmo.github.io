<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>404 - Không tìm thấy trang</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.card-404 {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px;
    max-width: 480px;
    width: 100%;
}

h1 {
    font-size: 96px;
    font-weight: 800;
    margin-bottom: 10px;
}

.btn-home {
    border-radius: 999px;
    padding: 10px 26px;
}
</style>
</head>

<body>

<div class="card-404 shadow-lg">
    <h1>404</h1>
    <h4 class="mb-3">Không tìm thấy trang</h4>
    <p class="mb-4">
        Bạn sẽ được chuyển về trang chủ sau
        <strong><span id="count">5</span> giây</strong>
    </p>

    <a href="/" class="btn btn-light btn-home fw-bold">
        🏠 Về trang chủ ngay
    </a>
</div>

<script>
let seconds = 5;
const countEl = document.getElementById("count");

const timer = setInterval(() => {
    seconds--;
    countEl.innerText = seconds;
    if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "/";
    }
}, 1000);
</script>

</body>
</html>
